<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Exam Performance AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            font-family: 'Segoe UI', sans-serif;
            min-block-size: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px;
            inline-size: 700px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            color: white;
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn-custom {
            border-radius: 30px;
            font-weight: bold;
            padding: 10px;
        }

        .prediction-box {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-block-start: 20px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255,255,255,0.2);
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-block-start: 10px;
        }

        footer {
            text-align: center;
            margin-block-start: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="glass-card">
    <h2 class="text-center mb-4">
        <i class="fa-solid fa-graduation-cap"></i> Student Performance Predictor
    </h2>

    <form action="{{ url_for('predict_datapoint') }}" method="post" onsubmit="showLoader()">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Gender</label>
                <select class="form-select" name="gender" required>
                    <option selected disabled value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Ethnicity</label>
                <select class="form-select" name="ethnicity" required>
                    <option selected disabled value="">Select Group</option>
                    <option value="group A">Group A</option>
                    <option value="group B">Group B</option>
                    <option value="group C">Group C</option>
                    <option value="group D">Group D</option>
                    <option value="group E">Group E</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label>Parental Education</label>
            <select class="form-select" name="parental_level_of_education" required>
                <option selected disabled value="">Select Education Level</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="high school">High School</option>
                <option value="master's degree">Master's Degree</option>
                <option value="some college">Some College</option>
                <option value="some high school">Some High School</option>
            </select>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Lunch Type</label>
                <select class="form-select" name="lunch" required>
                    <option selected disabled value="">Select Lunch</option>
                    <option value="free/reduced">Free/Reduced</option>
                    <option value="standard">Standard</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label>Test Preparation</label>
                <select class="form-select" name="test_preparation_course" required>
                    <option selected disabled value="">Select Status</option>
                    <option value="none">None</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Reading Score (0–100)</label>
                <input type="number" class="form-control" name="reading_score"
                       min="0" max="100" required oninput="calculateAverage()">
            </div>

            <div class="col-md-6 mb-3">
                <label>Writing Score (0–100)</label>
                <input type="number" class="form-control" name="writing_score"
                       min="0" max="100" required oninput="calculateAverage()">
            </div>
        </div>

        <!-- Live Average -->
        <div class="mb-3 text-center">
            <small>Live Average (Reading & Writing): 
                <strong id="avgScore">0</strong>
            </small>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning btn-custom">
                <i class="fa-solid fa-brain"></i> Predict Maths Score
            </button>
            <button type="reset" class="btn btn-light btn-custom">
                Reset Form
            </button>
        </div>

        <div class="loading-spinner" id="loader">
            <div class="spinner-border text-light" role="status"></div>
            <p>AI Model is predicting...</p>
        </div>
    </form>

    {% if results %}
    <div class="prediction-box mt-4">
        🎯 Predicted Maths Score: <br>
        <span style="font-size:30px;">{{ results }}</span>
    </div>
    {% endif %}

    <footer>
        Built with ❤️ using Flask & Machine Learning
    </footer>
</div>

<script>
    function showLoader() {
        document.getElementById("loader").style.display = "block";
    }

    function calculateAverage() {
        let reading = document.getElementsByName("reading_score")[0].value;
        let writing = document.getElementsByName("writing_score")[0].value;

        if (reading && writing) {
            let avg = (parseInt(reading) + parseInt(writing)) / 2;
            document.getElementById("avgScore").innerText = avg.toFixed(1);
        }
    }
</script>

</body>
</html>
